name: Update slideshow list

on:
  push:
    paths:
      - "slideshow/**"
      - ".github/workflows/update-slideshow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate slideshow/billeder.json
        shell: python
        run: |
          import json
          from pathlib import Path
          folder = Path("slideshow")
          folder.mkdir(exist_ok=True)
          allowed = {".jpg",".jpeg",".png",".webp",".gif",".avif"}
          files = sorted(p.name for p in folder.iterdir() if p.is_file() and p.suffix.lower() in allowed)
          (folder/"billeder.json").write_text(json.dumps(files, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
      - name: Commit list
        run: |
          if git diff --quiet slideshow/billeder.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slideshow/billeder.json
          git commit -m "Update slideshow image list"
          git push
